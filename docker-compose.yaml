services:
  watchtower:
    image: nickfedor/watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: watchtower
    restart: unless-stopped
    command: beermapping

  beermapping:
    image: mendbayare/beermapping
    ports:
      - 8080:8080
    restart: unless-stopped
    container_name: beermapping
